<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习4：路由守卫 beforeEach</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
    nav a { margin-right: 12px; }
    button { margin-right: 8px; margin-top: 8px; }
    .page-box { margin-top: 16px; padding: 12px; border: 1px solid #ccc; }
    .status { background: #f5f5f5; padding: 8px; margin: 8px 0; }
    .hint { color: #666; font-size: 14px; }
    .log { font-family: Consolas, monospace; font-size: 13px; color: #333; }
  </style>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
</head>
<body>
  <h2>练习 4：路由守卫 beforeEach</h2>
  <p class="hint">
    要练会什么：跳转前检查登录和管理员权限。
    对照项目：web/src/router/index.js 里的 beforeEach。
  </p>

  <div id="app">
    <div class="status">
      登录状态：<strong>{{ loggedIn ? '已登录' : '未登录' }}</strong>
      &nbsp;|&nbsp;
      角色：<strong>{{ role }}</strong>
    </div>
    <button type="button" @click="toggleLogin">切换登录/登出</button>
    <button type="button" @click="toggleRole">切换 admin / user</button>

    <nav style="margin-top: 12px;">
      <router-link to="/login">登录页</router-link>
      <router-link to="/memos">备忘录</router-link>
      <router-link to="/users">用户管理</router-link>
    </nav>
    <hr>
    <div class="page-box">
      <router-view></router-view>
    </div>
    <p class="hint">当前地址：<code>{{ $route.fullPath }}</code></p>
    <p class="hint log">守卫日志（最近一次）：{{ lastGuardLog }}</p>
  </div>

  <script>
    const { createApp, ref } = Vue
    const { createRouter, createWebHashHistory } = VueRouter

    const Login = { template: '<p>[登录页] 公开页面，无需登录</p>' }
    const Memos = { template: '<p>[备忘录] 需要登录才能访问</p>' }
    const Users = { template: '<p>[用户管理] 需要 admin 角色</p>' }

    const loggedIn = ref(false)
    const role = ref('user')
    const lastGuardLog = ref('（尚未导航）')

    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: '/login', component: Login, meta: { public: true } },
        { path: '/memos', component: Memos },
        { path: '/users', component: Users, meta: { admin: true } },
      ],
    })

    router.beforeEach((to, from, next) => {
      // 记录日志，方便对照测试步骤
      const logParts = [`从 ${from.path || '(初始)'} 到 ${to.path}`]

      if (to.meta.public) {
        if (loggedIn.value && to.path === '/login') {
          logParts.push('-> 已登录访问登录页，重定向到 /memos')
          lastGuardLog.value = logParts.join(' ')
          return next('/memos')
        }
        logParts.push('-> 公开页，放行')
        lastGuardLog.value = logParts.join(' ')
        return next()
      }

      if (!loggedIn.value) {
        logParts.push('-> 未登录，重定向到 /login')
        lastGuardLog.value = logParts.join(' ')
        return next('/login')
      }

      if (to.meta.admin && role.value !== 'admin') {
        logParts.push('-> 非 admin，重定向到 /memos')
        lastGuardLog.value = logParts.join(' ')
        return next('/memos')
      }

      logParts.push('-> 检查通过，放行')
      lastGuardLog.value = logParts.join(' ')
      next()
    })

    createApp({
      setup() {
        const toggleLogin = () => {
          loggedIn.value = !loggedIn.value
        }
        const toggleRole = () => {
          role.value = role.value === 'admin' ? 'user' : 'admin'
        }
        return { loggedIn, role, lastGuardLog, toggleLogin, toggleRole }
      },
    }).use(router).mount('#app')
  </script>
</body>
</html>
